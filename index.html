        <header>
            <h1>Aetherium IDE</h1>

                <textarea id="prompt-input" placeholder="Describe what you want to create... (e.g., 'a simple countdown timer', 'a button that shows a random fact', 'simulate a basic calculator')"></textarea>

                <div id="output-header">Output</div>
                <div id="output">

            </div>
        </main>
    </div>
